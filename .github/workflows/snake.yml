name: Generate Contribution Snake

on:
  # Daily at 00:17 UTC / 07:17 Vietnam time (GitHub may delay scheduled runs).
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish mint snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#10B981&color_dots=#EBEDF0,#D1FAE5,#A7F3D0,#34D399,#10B981
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#64FFDA&color_dots=#161B22,#123D35,#1D6B57,#34B891,#64FFDA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The output branch is reserved for generated assets; no Pages setup needed.
      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
